<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Car Service</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f2f2f7; color: #111; }
    header { background: #111827; color: white; padding: 25px 18px; padding-top: calc(25px + env(safe-area-inset-top)); }
    header h1 { margin: 0; font-size: 28px; }
    header p { margin: 5px 0 0; color: #cbd5e1; font-size: 14px; }
    .container { max-width: 700px; margin: auto; padding: 18px; }
    button { border: 0; padding: 12px 18px; border-radius: 10px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
    button:active { opacity: 0.7; }
    .primary { background: #2563eb; color: white; }
    .card { background: white; border-radius: 14px; padding: 16px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
  </style>
</head>
<body>
  <header>
    <h1>Car Service</h1>
    <p>Автосервіс та обслуговування</p>
  </header>
  <div class="container">
    <div class="card">
      <h2>Ласкаво просимо!</h2>
      <p>Ваш додаток успішно працює та готовий до використання.</p>
      <button class="primary">Записатися на сервіс</button>
    </div>
  </div>
</body>
</html>
