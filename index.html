<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Бортовий Журнал</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0b0b0e; color: #f4f4f5; padding: 16px; padding-bottom: 40px; }
    h1 { font-size: 22px; text-align: center; margin-top: 10px; margin-bottom: 15px; color: #3b82f6; }
    
    .card { background: #18181b; border-radius: 16px; padding: 18px; margin-bottom: 15px; border: 1px solid #27272a; }
    label { display: block; font-size: 13px; color: #a1a1aa; margin-bottom: 5px; font-weight: 500; }
    
    select, input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #3f3f46; background: #27272a; color: white; font-size: 16px; margin-bottom: 12px; outline: none; }
    
    .row { display: flex; gap: 10px; }
    .row > div { flex: 1; }
    
    button.btn-add { width: 100%; padding: 14px; border-radius: 10px; border: none; background: #2563eb; color: white; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 5px; }
    button.btn-add:active { background: #1d4ed8; }

    /* Карточка авто з фото */
    .car-card { background: #18181b; border-radius: 16px; overflow: hidden; border: 1px solid #27272a; margin-bottom: 15px; text-align: center; }
    .car-img { width: 100%; height: 200px; object-fit: cover; background: #27272a; }
    .car-title { padding: 12px; font-size: 18px; font-weight: bold; color: #60a5fa; }

    /* Статус нагадувань */
    .status-box { padding: 12px; border-radius: 12px; margin-bottom: 15px; font-size: 14px; font-weight: 500; }
    .status-ok { background: #064e3b; color: #34d399; border: 1px solid #059669; }
    .status-warn { background: #7f1d1d; color: #f87171; border: 1px solid #dc2626; }
    
    .filter-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px; }
    .filter-btn { background: #27272a; border: 1px solid #3f3f46; color: #a1a1aa; padding: 8px 14px; border-radius: 20px; font-size: 13px; white-space: nowrap; cursor: pointer; }
    .filter-btn.active { background: #2563eb; color: white; border-color: #2563eb; }

    .history-item { background: #18181b; border-radius: 12px; padding: 14px; margin-bottom: 10px; border: 1px solid #27272a; display: flex; justify-content: space-between; align-items: flex-start; }
    .category-badge { display: inline-block; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; text-transform: uppercase; margin-bottom: 6px; background: #3b82f620; color: #60a5fa; }
    .item-title { font-size: 16px; font-weight: 600; color: #fff; margin-bottom: 2px; }
    .item-sub { font-size: 13px; color: #a1a1aa; }
    .item-right { text-align: right; }
    .item-km { font-size: 15px; font-weight: 600; color: #34d399; }
    .item-price { font-size: 13px; color: #f43f5e; margin-top: 3px; }
    .btn-del { background: transparent; border: none; color: #71717a; font-size: 16px; cursor: pointer; padding: 0 0 0 10px; }
  </style>
</head>
<body>

  <h1>🚘 Сервісна Книжка</h1>

  <!-- Карточка авто -->
  <div class="car-card" id="carCard">
    <img id="carImgDisplay" class="car-img" src="https://images.unsplash.com/photo-1541348263662-e08266f9297a?auto=format&fit=crop&w=800&q=80" alt="Audi Q7">
    <div id="carTitleDisplay" class="car-title">🚗 Audi Q7</div>
  </div>

  <!-- Вибір авто -->
  <div class="card">
    <label>Вибери автомобіль або вкажи свій:</label>
    <select id="carPreset" onchange="applyPreset()">
      <option value="audi_q7">Audi Q7</option>
      <option value="vw_golf">Volkswagen Golf</option>
      <option value="vw_passat">Volkswagen Passat</option>
      <option value="bmw_3">BMW 3 Series</option>
      <option value="custom">Інше авто (власна назва)</option>
    </select>

    <div class="row">
      <div style="flex: 2;">
        <input type="text" id="carModel" placeholder="Марка та модель" value="Audi Q7">
      </div>
      <div style="flex: 1;">
        <input type="number" id="carYear" placeholder="Рік" value="2018">
      </div>
    </div>
    
    <button style="background: #374151; padding: 10px; font-size: 13px;" class="btn-add" onclick="saveCar()">Зберегти вибране авто</button>
  </div>

  <!-- Блок попереджень -->
  <div id="statusBox" class="status-box status-ok">
    💡 Запиши останній пробіг заміни масла, щоб активувати нагадування.
  </div>

  <!-- Форма запису робіт -->
  <div class="card">
    <label>Що міняв / робив:</label>
    <select id="category">
      <option value="🛢️ Моторне масло">🛢️ Моторне масло (кожні 10 тис. км)</option>
      <option value="🛞 Гальмівні колодки/диски">🛞 Гальмівні колодки/диски (кожні 30 тис. км)</option>
      <option value="💨 Фільтри (повітр./салон/паливн.)">💨 Фільтри (повітряний / салон / паливний)</option>
      <option value="🔧 Ходова / Підвіска">🔧 Ходова / Підвіска</option>
      <option value="⚡ Свічки запалювання">⚡ Свічки запалювання</option>
      <option value="⚙️ Масло КПП / АКПП">⚙️ Масло КПП / АКПП</option>
      <option value="🧪 Антифриз / Гальмівна рідина">🧪 Антифриз / Гальмівна рідина</option>
      <option value="🛠️ Інший ремонт">🛠️ Інший ремонт / Деталі</option>
    </select>

    <div class="row">
      <div>
        <label>Пробіг (км):</label>
        <input type="number" id="km" placeholder="185000">
      </div>
      <div>
        <label>Дата:</label>
        <input type="date" id="date">
      </div>
    </div>

    <label>Фірма, деталь або нотатки:</label>
    <input type="text" id="note" placeholder="напр. Brembo, 5W-30 Motul...">

    <label>Ціна (грн):</label>
    <input type="number" id="price" placeholder="2500">

    <button class="btn-add" onclick="saveData()">Записати в журнал</button>
  </div>

  <div class="filter-bar" id="filters">
    <button class="filter-btn active" onclick="filterCat('ALL', this)">Всі</button>
    <button class="filter-btn" onclick="filterCat('🛢️ Моторне масло', this)">Масло</button>
    <button class="filter-btn" onclick="filterCat('🛞 Гальмівні колодки/диски', this)">Колодки</button>
    <button class="filter-btn" onclick="filterCat('💨 Фільтри (повітр./салон/паливн.)', this)">Фільтри</button>
    <button class="filter-btn" onclick="filterCat('🔧 Ходова / Підвіска', this)">Ходова</button>
  </div>

  <h2>Історія обслуговування:</h2>
  <div id="history"></div>

  <script>
    document.getElementById('date').valueAsDate = new Date();
    let currentFilter = 'ALL';

    const carPresets = {
      audi_q7: {
        model: 'Audi Q7',
        img: 'https://images.unsplash.com/photo-1541348263662-e08266f9297a?auto=format&fit=crop&w=800&q=80'
      },
      vw_golf: {
        model: 'Volkswagen Golf',
        img: 'https://images.unsplash.com/photo-1539799139339-50c5fe1e2b1b?auto=format&fit=crop&w=800&q=80'
      },
      vw_passat: {
        model: 'Volkswagen Passat',
        img: 'https://images.unsplash.com/photo-1549399542-7e3f8b79c341?auto=format&fit=crop&w=800&q=80'
      },
      bmw_3: {
        model: 'BMW 3 Series',
        img: 'https://images.unsplash.com/photo-1555215695-3004980ad54e?auto=format&fit=crop&w=800&q=80'
      }
    };

    function applyPreset() {
      const presetKey = document.getElementById('carPreset').value;
      if (presetKey !== 'custom' && carPresets[presetKey]) {
        document.getElementById('carModel').value = carPresets[presetKey].model;
      }
    }

    function loadCar() {
      const car = JSON.parse(localStorage.getItem('car_info') || '{}');
      const imgElem = document.getElementById('carImgDisplay');
      const titleElem = document.getElementById('carTitleDisplay');

      if (car.model) {
        document.getElementById('carModel').value = car.model || '';
        document.getElementById('carYear').value = car.year || '';
        titleElem.innerText = `🚗 ${car.model} ${car.year ? '(' + car.year + ')' : ''}`;

        if (car.imgUrl) {
          imgElem.src = car.imgUrl;
        }
      }
    }

    function saveCar() {
      const model = document.getElementById('carModel').value;
      const year = document.getElementById('carYear').value;
      const presetKey = document.getElementById('carPreset').value;

      let imgUrl = carPresets[presetKey] ? carPresets[presetKey].img : 'https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=800&q=80';

      localStorage.setItem('car_info', JSON.stringify({ model, year, imgUrl }));
      loadCar();
      alert('Авто збережено!');
    }

    function checkReminders(history) {
      const statusBox = document.getElementById('statusBox');
      const lastOil = history.find(i => i.category.includes('Моторне масло'));
      
      if (!lastOil) {
        statusBox.className = "status-box status-ok";
        statusBox.innerHTML = "💡 Запиши останню заміну масла, щоб бачити нагадування.";
        return;
      }

      const lastOilKm = parseInt(lastOil.km) || 0;
      const latestKm = Math.max(...history.map(i => parseInt(i.km) || 0));
      const diffKm = latestKm - lastOilKm;

      if (diffKm >= 10000) {
        statusBox.className = "status-box status-warn";
        statusBox.innerHTML = `⚠️ <b>ПОРА МІНЯТИ МАСЛО!</b><br>Пройшло вже ${diffKm} км з останньої заміни.`;
      } else {
        statusBox.className = "status-box status-ok";
        statusBox.innerHTML = `✅ До наступної заміни масла залишилось: <b>${10000 - diffKm} км</b>`;
      }
    }

    function filterCat(cat, btn) {
      currentFilter = cat;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderHistory();
    }

    function renderHistory() {
      const history = JSON.parse(localStorage.getItem('car_service_log') || '[]');
      const container = document.getElementById('history');
      
      checkReminders(history);

      const filtered = currentFilter === 'ALL' 
        ? history 
        : history.filter(item => item.category === currentFilter);

      if (filtered.length === 0) {
        container.innerHTML = '<p style="color: #71717a; text-align: center; margin-top: 20px;">Записів за цим фільтром немає</p>';
        return;
      }

      container.innerHTML = filtered.map((item, index) => `
        <div class="history-item">
          <div>
            <span class="category-badge">${item.category}</span>
            <div class="item-title">${item.note || 'Заміна / Обслуговування'}</div>
            <div class="item-sub">${item.date}</div>
          </div>
          <div class="item-right">
            <div class="item-km">${item.km} км</div>
            ${item.price ? `<div class="item-price">${item.price} грн</div>` : ''}
          </div>
          <button class="btn-del" onclick="deleteItem(${index})">✕</button>
        </div>
      `).join('');
    }

    function saveData() {
      const category = document.getElementById('category').value;
      const km = document.getElementById('km').value;
      const date = document.getElementById('date').value;
      const note = document.getElementById('note').value;
      const price = document.getElementById('price').value;

      if (!km) { alert('Вкажи пробіг!'); return; }

      const history = JSON.parse(localStorage.getItem('car_service_log') || '[]');
      history.unshift({ category, km, date, note, price });
      localStorage.setItem('car_service_log', JSON.stringify(history));

      document.getElementById('km').value = '';
      document.getElementById('note').value = '';
      document.getElementById('price').value = '';
      renderHistory();
    }

    function deleteItem(index) {
      if (confirm('Видалити цей запис?')) {
        const history = JSON.parse(localStorage.getItem('car_service_log') || '[]');
        history.splice(index, 1);
        localStorage.setItem('car_service_log', JSON.stringify(history));
        renderHistory();
      }
    }

    loadCar();
    renderHistory();
  </script>

</body>
</html>
